name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    name: Package and release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Tag matches TOC version
        run: |
          version="$(sed -n 's/^## Version: *//p' Groupee/Groupee.toc | tr -d '\r')"
          if [[ "$GITHUB_REF_NAME" != "v$version" ]]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match TOC version $version"
            exit 1
          fi

      # Packages per .pkgmeta, then uploads to CurseForge (X-Curse-Project-ID in
      # the TOC) and creates the GitHub release with the zip attached.
      - uses: BigWigsMods/packager@v2
        env:
          CF_API_KEY: ${{ secrets.CF_API_KEY }}
          GITHUB_OAUTH: ${{ secrets.GITHUB_TOKEN }}
